<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黄金价格换算器</title>
    <link rel="stylesheet" href="./styles.css?v=20260528-refresh" />
  </head>
  <body>
    <main class="app-shell">
      <section class="converter-panel" aria-labelledby="page-title">
        <header class="app-header">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 16h14" />
              <path d="M7 16 10 7h4l3 9" />
              <path d="M9 11h6" />
            </svg>
          </span>
          <div>
            <p class="eyebrow">Gold Converter</p>
            <h1 id="page-title">黄金价格换算器</h1>
          </div>
        </header>

        <section class="spot-panel" aria-labelledby="spot-price-title">
          <div class="spot-header">
            <div>
              <p class="eyebrow">Live Gold</p>
              <h2 id="spot-price-title">当前金价</h2>
            </div>
            <div class="spot-actions">
              <span id="spot-price-status">正在获取金价</span>
              <button class="icon-button" id="refresh-gold-button" type="button" aria-label="刷新当前金价">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12a9 9 0 0 1-15.3 6.4" />
                  <path d="M3 12A9 9 0 0 1 18.3 5.6" />
                  <path d="M18 2v4h-4" />
                  <path d="M6 22v-4h4" />
                </svg>
              </button>
            </div>
          </div>

          <div class="spot-grid" aria-live="polite">
            <div class="spot-card">
              <span>美元/盎司</span>
              <strong id="spot-usd-price">--</strong>
            </div>
            <div class="spot-card">
              <span>人民币/克</span>
              <strong id="spot-cny-price">--</strong>
            </div>
          </div>

          <div class="spot-chart-panel" aria-labelledby="spot-chart-title">
            <div class="spot-chart-header">
              <div>
                <h3 id="spot-chart-title">现货过去24小时</h3>
                <p id="spot-chart-meta">正在加载 XAU/USD 现货曲线</p>
              </div>
              <strong id="spot-chart-change">--</strong>
            </div>

            <svg
              class="spot-chart"
              viewBox="0 0 640 180"
              role="img"
              aria-label="XAU/USD 现货黄金过去24小时曲线图"
              preserveAspectRatio="none"
            >
              <line class="spot-chart-grid" x1="0" y1="45" x2="640" y2="45" />
              <line class="spot-chart-grid" x1="0" y1="90" x2="640" y2="90" />
              <line class="spot-chart-grid" x1="0" y1="135" x2="640" y2="135" />
              <path id="spot-chart-line" d="" />
            </svg>
          </div>
        </section>

        <form class="converter-form" id="converter-form" autocomplete="off">
          <fieldset class="direction-group">
            <legend>换算方向</legend>
            <div class="segmented-control" role="radiogroup" aria-label="换算方向">
              <label>
                <input type="radio" name="direction" value="usd-to-cny" checked />
                <span>美元/盎司 → 人民币/克</span>
              </label>
              <label>
                <input type="radio" name="direction" value="cny-to-usd" />
                <span>人民币/克 → 美元/盎司</span>
              </label>
            </div>
          </fieldset>

          <div class="converter-row">
            <label class="field converter-input-field" for="price-input">
              <span id="price-label">美元计价黄金价格</span>
              <div class="input-shell">
                <input
                  id="price-input"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  step="0.01"
                  value="5000"
                  placeholder="2300.00"
                  aria-describedby="status-line"
                />
                <span id="price-unit">美元/盎司</span>
              </div>
            </label>

            <span class="conversion-arrow" aria-hidden="true">→</span>

            <div class="result-strip" aria-live="polite">
              <div>
                <span class="result-label">换算结果</span>
                <strong id="result-number">--</strong>
                <small id="result-unit">人民币/克</small>
              </div>
            </div>
          </div>

          <label class="field is-hidden" id="manual-rate-field" for="rate-input">
            <span>美元兑人民币汇率</span>
            <div class="input-shell">
              <input
                id="rate-input"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.0001"
                placeholder="7.2000"
                aria-describedby="status-line"
              />
              <span>CNY/USD</span>
            </div>
          </label>

          <div class="converter-meta">
            <span id="rate-summary">获取 USD/CNY 中</span>
            <span class="status-line" id="status-line" role="status">待汇率</span>
            <span class="formula-line" id="formula-text">USD/oz × 汇率 ÷ 31.1034768 = CNY/g</span>
          </div>
        </form>

        <section class="quick-table" aria-labelledby="quick-table-title">
          <div class="quick-table-header">
            <div>
              <p class="eyebrow">Quick Reference</p>
              <h2 id="quick-table-title">黄金价格速查表</h2>
            </div>
            <span id="quick-table-rate">等待汇率</span>
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">美元/盎司</th>
                  <th scope="col">人民币/克</th>
                </tr>
              </thead>
              <tbody id="quick-table-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js?v=20260528-refresh"></script>
  </body>
</html>
